name: Deploy to Server

# Триггер: запускать при пуше в ветку main
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build HackBack_2026.slnx -warnaserror --nologo

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            cd /app

            git fetch origin
            git reset --hard origin/main

            echo "Собираем новый образ (старый контейнер ещё работает)"
            docker build -t hackback-api .

            docker stop hackback_api || true
            docker rm hackback_api || true
            docker run -d \
              --name hackback_api \
              --restart always \
              -e ASPNETCORE_ENVIRONMENT=Development \
              -p 5170:5170 \
              -v hackback_data:/app/data \
              hackback-api

            echo "Ждём, пока приложение поднимется"
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:5170/metrics > /dev/null; then
                echo "Здеплоин"
                exit 0
              fi
              sleep 2
            done

            echo "Приложение не поднялось за 60 секунд"
            exit 1
