name: Deploy to Server

# Триггер: запускать при пуше в ветку main
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build HackBack_2026.slnx -warnaserror --nologo

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            cd /app

            DOMAIN=hack-analyzer.ddns.net

            # Первый выпуск Let's Encrypt, если сертификата ещё нет (нужен свободный порт 80)
            if [ ! -f /etc/letsencrypt/live/$DOMAIN/fullchain.pem ]; then
              command -v certbot >/dev/null 2>&1 || apt-get install -y -qq certbot
              certbot certonly --standalone --non-interactive --agree-tos \
                --register-unsafely-without-email -d $DOMAIN
            fi

            # После продления сертификата перезапускаем контейнер, чтобы Kestrel подхватил новый
            mkdir -p /etc/letsencrypt/renewal-hooks/deploy
            printf '#!/bin/sh\ndocker restart hackback_api >/dev/null 2>&1 || true\n' > /etc/letsencrypt/renewal-hooks/deploy/hackback-restart.sh
            chmod +x /etc/letsencrypt/renewal-hooks/deploy/hackback-restart.sh

            git fetch origin
            git reset --hard origin/main

            echo "Собираем новый образ (старый контейнер ещё работает)"
            docker build -t hackback-api .

            docker stop hackback_api || true
            docker rm hackback_api || true
            docker run -d \
              --name hackback_api \
              --restart always \
              -e ASPNETCORE_ENVIRONMENT=Development \
              -p 3000:3000 \
              -v hackback_data:/app/data \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              hackback-api

            echo "Ждём, пока приложение поднимется"
            for i in $(seq 1 30); do
              if curl -fsS --resolve $DOMAIN:443:127.0.0.1 https://$DOMAIN/metrics > /dev/null; then
                echo "Здеплоин"
                exit 0
              fi
              sleep 2
            done

            exit 1
